<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.danmercede.info/" />
  <title>Dan Mercede — Founder &amp; AI Systems Architect</title>
  <meta name="description"
    content="Identity verification and structured data for Dan Mercede. Founder &amp; AI Systems Architect, Technology Executive." />

  <!-- Open Graph -->
  <meta property="og:type" content="profile" />
  <meta property="og:site_name" content="Dan Mercede" />
  <meta property="og:title" content="Dan Mercede — Founder &amp; AI Systems Architect" />
  <meta property="og:description"
    content="Identity verification and structured data for Dan Mercede. Founder &amp; AI Systems Architect, Technology Executive." />
  <meta property="og:url" content="https://www.danmercede.info/" />
  <!-- Shares the canonical "Dan Mercede" OG card with danielmercede.info by design
       (both are .info identity spokes for the same person); a distinct per-spoke
       card is deferred pending a new asset. -->
  <meta property="og:image" content="https://www.danmercede.info/dan-mercede-og-card.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Dan Mercede, Founder &amp; AI Systems Architect" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@danmercede" />
  <meta name="twitter:creator" content="@danmercede" />
  <meta name="twitter:title" content="Dan Mercede — Founder &amp; AI Systems Architect" />
  <meta name="twitter:description"
    content="Identity verification and structured data for Dan Mercede. Founder &amp; AI Systems Architect, Technology Executive." />
  <meta name="twitter:image" content="https://www.danmercede.info/dan-mercede-og-card.jpg" />
  <meta name="twitter:image:alt" content="Dan Mercede, Founder &amp; AI Systems Architect" />

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" href="/favicon.ico">

  <!-- Structured data: WebPage + WebSite backlinking identity to the hub Person (danmercede.com/#person). Static so crawlers see it without executing JS. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebPage",
          "@id": "https://www.danmercede.info/#webpage",
          "url": "https://www.danmercede.info/",
          "name": "Dan Mercede — Founder & AI Systems Architect",
          "about": { "@id": "https://www.danmercede.com/#person" },
          "isPartOf": { "@id": "https://www.danmercede.info/#website" }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.danmercede.info/#website",
          "url": "https://www.danmercede.info/",
          "publisher": { "@id": "https://www.danmercede.com/#person" }
        }
      ]
    }
  </script>

  <!-- Fonts: Inter for UI, JetBrains Mono for Data/Checksum feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Tailwind is bundled at build time (compiled stylesheet emitted by Vite);
       the render-blocking Tailwind CDN JIT compiler, the inline `tailwind.config`,
       and the base/print <style> have moved to tailwind.config.js + index.css. -->
</head>

<body class="bg-white text-neutral-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
